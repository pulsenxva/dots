[general]
import = ["~/.config/alacritty/themes/default.toml"]

[font]
size = 9.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window.padding]
x = 20
y = 20

[window]
dimensions = { columns = 120, lines = 37 }
opacity = 1
blur = true

# Cursor style
[cursor]
style = "Block"
unfocused_hollow = true
