# Kanagawa Wave theme for Alacritty

[colors]

# Default colors
[colors.primary]
background = "#1F1F28"
foreground = "#DCD7BA"

# Normal colors
[colors.normal]
black   = "#090618"
red     = "#C34043"
green   = "#76946A"
yellow  = "#C0A36E"
blue    = "#7E9CD8"
magenta = "#957FB8"
cyan    = "#6A9589"
white   = "#C8C093"

# Bright colors
[colors.bright]
black   = "#727169"
red     = "#E82424"
green   = "#98BB6C"
yellow  = "#E6C384"
blue    = "#7FB4CA"
magenta = "#938AA9"
cyan    = "#7AA89F"
white   = "#DCD7BA"

# Selection colors
[colors.selection]
text       = "#1F1F28"
background = "#2D4F67"

# Cursor colors
[colors.cursor]
text   = "#1F1F28"
cursor = "#C8C093"

# Vi mode cursor colors
[colors.vi_mode_cursor]
text   = "#1F1F28"
cursor = "#C8C093"

# Search colors
[colors.search]

[colors.search.matches]
foreground = "#1F1F28"
background = "#DCD7BA"

[colors.search.focused_match]
foreground = "#1F1F28"
background = "#FF9E3B"

# Footer bar colors
[colors.footer_bar]
background = "#16161D"
foreground = "#DCD7BA"
