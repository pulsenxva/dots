# Tokyo Night theme for Alacritty

[colors]
# Default colors
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

# Normal colors
[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

# Bright colors
[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

# Selection colors
[colors.selection]
text       = "#c0caf5"
background = "#364a82"

# Cursor colors
[colors.cursor]
text   = "#1a1b26"
cursor = "#c0caf5"

# Vi mode cursor colors
[colors.vi_mode_cursor]
text   = "#1a1b26"
cursor = "#c0caf5"

# Search colors
[colors.search]
[colors.search.matches]
foreground = "#1a1b26"
background = "#e0af68"
[colors.search.focused_match]
foreground = "#1a1b26"
background = "#f7768e"

# Footer bar colors
[colors.footer_bar]
background = "#16161e"
foreground = "#c0caf5"

# Hint colors
[colors.hints]
[colors.hints.start]
foreground = "#1a1b26"
background = "#e0af68"
[colors.hints.end]
foreground = "#1a1b26"
background = "#7aa2f7"
