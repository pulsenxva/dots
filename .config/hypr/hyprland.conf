#MONITORS
monitor = eDP-1, 1920x1200, -1920x0, 1
monitor = HDMI-A-1, 2560x1440, 0x0, 1
#MY PROGRAMS
$terminal = alacritty
$fileManager = nautilus
$menu = wofi
#$browser = flatpak run app.zen_browser.zen
$browser = helium-browser
$bar = waybar
$calculator = gnome-calculator --mode=keyboard
$network = throne

#AUTOSTART

# for vscode
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = export $(gnome-keyring-daemon --start --components=secrets)

# auto mounting
#exec-once = udiskie
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout 'appmenu:close'
exec-once = systemctl --user start hyprpolkitagent
exec-once = swayosd-server
exec-once = hyprpaper
#exec-once = swaybg -i /home/jonathan/wp/a_beach_with_waves_and_rocks.jpg -m fill
exec-once = dunst & waybar
exec-once = wl-clipboard-history -t
exec-once = wl-paste --watch cliphist store
exec-once = wl-clip-persist --clipboard regular --display wayland-1
#ENVIRONMENT VARIABLES
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
#LOOK AND FEEL

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

general {
  gaps_in = 3
  gaps_out = 3, 4, 4, 4
  border_size = 0
  col.active_border = 0xffcba6f7
  layout = dwindle
}

decoration {
  rounding = 7
  #rounding = 0
  active_opacity = 1.0
  inactive_opacity = 1.0
  blur {
    enabled = yes
    size = 5
    passes = 2
    new_optimizations = true
    vibrancy = 1
  }
  shadow {
    enabled=false
    range = 4
    offset = 2 2
    render_power = 2
    color = 0x66000000
  }
}

animations {
  enabled = yes
  bezier = easeOutQuint,0.23,1,0.32,1        
  bezier = easeInOutCubic,0.65,0.05,0.36,1        
  bezier = linear,0,0,1,1        
  bezier = almostLinear,0.5,0.5,0.75,1.0        
  bezier = quick,0.15,0,0.1,1        
  animation = global, 1, 10, default        
  animation = border, 1, 5.39, easeOutQuint        
  animation = windows, 1, 4.79, easeOutQuint        
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%        
  animation = windowsOut, 1, 1.49, linear, popin 87%        
  animation = fadeIn, 1, 1.73, almostLinear        
  animation = fadeOut, 1, 1.46, almostLinear        
  animation = fade, 1, 3.03, quick        
  animation = layers, 1, 3.81, easeOutQuint        
  animation = layersIn, 1, 4, easeOutQuint, fade        
  animation = layersOut, 1, 1.5, linear, fade        
  animation = fadeLayersIn, 1, 1.79, almostLinear        
  animation = fadeLayersOut, 1, 1.39, almostLinear        
  animation = workspaces, 1, 1.94, almostLinear, fade        
  animation = workspacesIn, 1, 1.21, almostLinear, fade        
  animation = workspacesOut, 1, 1.94, almostLinear, fade        
}

dwindle {
  preserve_split = true
}

master {
  new_status = master
  new_on_top = true
}

general {
  col.active_border = rgb(268bd2) 
  col.inactive_border = rgb(1a1a1a)
}

gesture = 3, horizontal, workspace
gestures {
  workspace_swipe_forever=true
  workspace_swipe_invert=true
}

#INPUT
input {
  kb_layout = us,ru
  kb_variant =
  kb_model =
  kb_options = grp:alt_shift_toggle
  kb_rules =
 
  repeat_rate = 35
  repeat_delay = 200

  follow_mouse = 1
  sensitivity = -1
  #sensitivity = -0.7
  touchpad {
    natural_scroll = true
    scroll_factor = 0.3
  }
}
device {
  name = elan2611:00-04f3:31dc-touchpad
  sensitivity = 0
}

#KEYBINDINGS
$mainMod = SUPER
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod shift, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, O, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, F, fullscreen,
bind = $mainMod, T, exec, Telegram
bind = $mainMod, D, exec, emacs
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, B, exec, $browser
bind = $mainMod, R, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, W, exec, pkill $bar || $bar
bind = $mainMod, K, exec, $calculator
bind = $mainMod, M, exec, blueman-manager
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = $mainMod, N, exec, $network
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = ALT, left, movewindow, l
bind = ALT, right, movewindow, r
bind = ALT, up, movewindow, u
bind = ALT, down, movewindow, d
#bind = ALT, left, swapwindow, l
#bind = ALT, right, swapwindow, r
#bind = ALT, up, swapwindow, u
#bind = ALT, down, swapwindow, d
binde = CTRL, up, resizeactive, 0 -20
binde = CTRL, down, resizeactive, 0 20
binde = SUPER, bracketleft, resizeactive, -20 0
binde = SUPER, bracketright, resizeactive, 20 0
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod shift, 1, movetoworkspace, 1
bind = $mainMod shift, 2, movetoworkspace, 2
bind = $mainMod shift, 3, movetoworkspace, 3
bind = $mainMod shift, 4, movetoworkspace, 4
bind = $mainMod shift, 5, movetoworkspace, 5
bind = $mainMod shift, 6, movetoworkspace, 6
bind = $mainMod shift, 7, movetoworkspace, 7
bind = $mainMod shift, 8, movetoworkspace, 8
bind = $mainMod shift, 9, movetoworkspace, 9
bind = $mainMod shift, 0, movetoworkspace, 10
bind = $mainMod, A, togglespecialworkspace, magic
bind = $mainMod shift, A, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume Control (using wpctl)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness Control (using brightnessctl)
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

